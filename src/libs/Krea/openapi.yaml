  # ─── Styles (LoRA) ──────────────────────────────────────────────────────────
  /styles:
    get:
      operationId: listStyles
      summary: Search / list styles
      tags: [Styles]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: query
          in: query
          description: Free-text search.
          schema: { type: string }
      responses:
        '200':
          description: Paginated list of styles.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StyleList' }
  /styles/train:
    post:
      operationId: trainStyle
      summary: Train a custom style (LoRA)
      tags: [Styles]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StyleTrainRequest' } } }
      responses:
        '200':
          description: Training job created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
  /styles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getStyle
      summary: Get a style by ID
      tags: [Styles]
      responses:
        '200':
          description: The style.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Style' }
    patch:
      operationId: updateStyle
      summary: Update a style
      tags: [Styles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        '200':
          description: Updated style.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Style' }
  /styles/{id}/share/link:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getStyleShareLink
      summary: Get a shareable link for a style
      tags: [Styles]
      responses:
        '200':
          description: Shareable link.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StyleShareLink' }
  /styles/{id}/share/workspace:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: shareStyleWithWorkspace
      summary: Share a style with the current workspace
      tags: [Styles]
      responses:
        '200':
          description: Shared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteResponse' }
    delete:
      operationId: unshareStyleFromWorkspace
      summary: Remove a style from the current workspace
      tags: [Styles]
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteResponse' }

  # ─── Node Apps ──────────────────────────────────────────────────────────────
  /node-apps/{id}:
    parameters:
      - name: id
